<dl class="enrol-bank-details">
  <div>
    <dt>BSB</dt>
    <dd>
      <span data-transfer-value>{{ bank_details.bsb }}</span>
      <button type="button" class="enrol-copy" data-transfer-copy="BSB" data-copy-value="{{ bank_details.bsb|cut:'-' }}" data-tooltip="Copy" aria-label="Copy BSB" hidden>
        <svg class="enrol-copy-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 9V6.5A1.5 1.5 0 0 0 13.5 5h-7A1.5 1.5 0 0 0 5 6.5v7A1.5 1.5 0 0 0 6.5 15H9"></path></svg>
        <svg class="enrol-copy-check" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7"></path></svg>
      </button>
    </dd>
  </div>
  <div>
    <dt>Account number</dt>
    <dd>
      <span data-transfer-value>{{ bank_details.account }}</span>
      <button type="button" class="enrol-copy" data-transfer-copy="Account number" data-tooltip="Copy" aria-label="Copy account number" hidden>
        <svg class="enrol-copy-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 9V6.5A1.5 1.5 0 0 0 13.5 5h-7A1.5 1.5 0 0 0 5 6.5v7A1.5 1.5 0 0 0 6.5 15H9"></path></svg>
        <svg class="enrol-copy-check" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7"></path></svg>
      </button>
    </dd>
  </div>
</dl>
