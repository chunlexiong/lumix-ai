<dl class="enrol-bank-details">
  <div>
    <dt>BSB</dt>
    <dd>
      <span data-transfer-value>{{ bank_details.bsb }}</span>
      <button type="button" class="enrol-copy" data-transfer-copy="BSB" aria-label="Copy BSB" hidden>Copy</button>
    </dd>
  </div>
  <div>
    <dt>Account number</dt>
    <dd>
      <span data-transfer-value>{{ bank_details.account }}</span>
      <button type="button" class="enrol-copy" data-transfer-copy="Account number" aria-label="Copy account number" hidden>Copy</button>
    </dd>
  </div>
</dl>
