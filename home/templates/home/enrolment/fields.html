{{ form.non_field_errors }}
{% for field in form.visible_fields %}
  <div class="enrol-field" data-field="{{ field.name }}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="enrol-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
